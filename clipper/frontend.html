<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>clipper</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 80px auto; color: #222; }
  h2 { margin-bottom: 4px; }
  p.sub { color: #777; margin-top: 0; font-size: 14px; }
  input { width: 100%; padding: 10px; font-size: 15px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 16px; color: #555; font-size: 14px; }
</style>
</head>
<body>
  <h2>clipper</h2>
  <p class="sub">Paste a YouTube URL. Progress prints in the server terminal.</p>
  <input id="url" placeholder="https://www.youtube.com/watch?v=..." />
  <button id="go" onclick="submitUrl()">Process</button>
  <div id="status"></div>

<script>
async function submitUrl() {
  const url = document.getElementById('url').value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('go');
  if (!url) { status.textContent = 'paste a YouTube URL first'; return; }

  btn.disabled = true;
  status.textContent = 'starting...';
  try {
    const res = await fetch('/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ youtube_url: url })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'request failed');
    status.textContent = `job ${data.job_id} started - check your server terminal for progress`;
  } catch (err) {
    status.textContent = `error: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
